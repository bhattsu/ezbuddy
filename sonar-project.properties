sonar.projectKey=US-Legal_pro.
sonar.projectName=US Legal Pro
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# Source code
sonar.sources=app

# Test code
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Python
sonar.python.version=3.11

# Coverage generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Files/directories that should not be analyzed
sonar.exclusions=\
app/**/__pycache__/**,\
app/**/*.pyc,\
scripts/**,\
tests/**

# Do not include test/support code in coverage calculation
sonar.coverage.exclusions=\
tests/**,\
scripts/**

# Ignore duplication analysis for tests
sonar.cpd.exclusions=\
tests/**

# Do not wait for Quality Gate yet.
# We want the first run to show the actual coverage/results.
sonar.qualitygate.wait=false---
