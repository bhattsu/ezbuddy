

# ---------------------------------------------------------------------------
# Conversations
# ---------------------------------------------------------------------------

# $1 user_id, $2 optional case_id
fetch_active_by_user: |
  SELECT
      c.id AS conversation_id,
      c.user_id,
      c.case_id,
      c.session_id,
      c.status,
      c.started_at,
      c.ended_at,
      c.created_at
  FROM conversations.conversations c
  WHERE c.user_id = $1
    AND c.status = 'ACTIVE'
    AND ($2::uuid IS NULL OR c.case_id = $2)
  ORDER BY c.started_at DESC
  LIMIT 1

# $1 conversation_id
fetch_by_id: |
  SELECT
      c.id AS conversation_id,
      c.user_id,
      c.case_id,
      c.session_id,
      c.status,
      c.started_at,
      c.ended_at,
      c.created_at
  FROM conversations.conversations c
  WHERE c.id = $1
  LIMIT 1

# $1 user_id, $2 optional status, $3 limit
list_by_user: |
  SELECT
      c.id AS conversation_id,
      c.user_id,
      c.case_id,
      c.session_id,
      c.status,
      c.started_at,
      c.ended_at,
      c.created_at
  FROM conversations.conversations c
  WHERE c.user_id = $1
    AND ($2::text IS NULL OR c.status = $2)
  ORDER BY c.started_at DESC
  LIMIT COALESCE($3::int, 50)

# $1 user_id, $2 optional case_id, $3 optional session_id
insert_conversation: |
  INSERT INTO conversations.conversations (
      user_id,
      case_id,
      session_id,
      status
  )
  VALUES (
      $1,
      $2,
      $3,
      'ACTIVE'
  )
  RETURNING
      id AS conversation_id,
      user_id,
      case_id,
      session_id,
      status,
      started_at,
      created_at

# $1 conversation_id
complete_conversation: |
  UPDATE conversations.conversations
  SET status = 'COMPLETED',
      ended_at = CURRENT_TIMESTAMP
  WHERE id = $1
    AND status = 'ACTIVE'
  RETURNING
      id AS conversation_id,
      status,
      ended_at

# ---------------------------------------------------------------------------
# Messages — history
# ---------------------------------------------------------------------------

# $1 conversation_id, $2 limit (oldest → newest)
list_messages: |
  SELECT
      m.id AS message_id,
      m.conversation_id,
      m.sender,
      m.message,
      m.created_at
  FROM conversations.messages m
  WHERE m.conversation_id = $1
  ORDER BY m.created_at ASC, m.id ASC
  LIMIT COALESCE($2::int, 200)

# Full history for a conversation (no limit alias — use large limit via list_messages)
# $1 conversation_id, $2 limit
fetch_history: |
  SELECT
      m.id AS message_id,
      m.conversation_id,
      m.sender,
      m.message,
      m.created_at
  FROM conversations.messages m
  WHERE m.conversation_id = $1
  ORDER BY m.created_at ASC, m.id ASC
  LIMIT COALESCE($2::int, 500)

# Recent messages newest-first (useful for UI reverse pagination)
# $1 conversation_id, $2 limit
fetch_history_recent: |
  SELECT
      m.id AS message_id,
      m.conversation_id,
      m.sender,
      m.message,
      m.created_at
  FROM conversations.messages m
  WHERE m.conversation_id = $1
  ORDER BY m.created_at DESC, m.id DESC
  LIMIT COALESCE($2::int, 50)

# History for a user's active conversation (joins conversation)
# $1 user_id, $2 optional case_id, $3 limit
fetch_history_by_user: |
  SELECT
      m.id AS message_id,
      m.conversation_id,
      m.sender,
      m.message,
      m.created_at,
      c.user_id,
      c.case_id,
      c.session_id,
      c.status AS conversation_status
  FROM conversations.conversations c
  INNER JOIN conversations.messages m ON m.conversation_id = c.id
  WHERE c.user_id = $1
    AND c.status = 'ACTIVE'
    AND ($2::uuid IS NULL OR c.case_id = $2)
  ORDER BY m.created_at ASC, m.id ASC
  LIMIT COALESCE($3::int, 500)

# Messages after a cursor timestamp (incremental sync)
# $1 conversation_id, $2 after_created_at, $3 limit
fetch_history_after: |
  SELECT
      m.id AS message_id,
      m.conversation_id,
      m.sender,
      m.message,
      m.created_at
  FROM conversations.messages m
  WHERE m.conversation_id = $1
    AND m.created_at > $2::timestamp
  ORDER BY m.created_at ASC, m.id ASC
  LIMIT COALESCE($3::int, 200)

