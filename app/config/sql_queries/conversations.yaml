# ---------------------------------------------------------------------------
# Attachments
# ---------------------------------------------------------------------------

# $1 conversation_id
list_attachments: |
  SELECT
      a.id AS attachment_id,
      a.conversation_id,
      a.document_id,
      a.created_at,
      d.document_name,
      d.document_type,
      d.s3_bucket,
      d.s3_key
  FROM conversations.attachments a
  INNER JOIN documents.documents d ON d.id = a.document_id
  WHERE a.conversation_id = $1
  ORDER BY a.created_at DESC NULLS LAST

# $1 conversation_id, $2 document_id
insert_attachment: |
  INSERT INTO conversations.attachments (
      conversation_id,
      document_id
  )
  VALUES (
      $1,
      $2
  )
  RETURNING
      id AS attachment_id,
      conversation_id,
      document_id,
      created_at
